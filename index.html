<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Access 1 Audios</title>
  <meta name="description" content="Audiodateien zum Access Workbook 1 (Cornelsen), sortiert nach Unit und Seite.">

  <!-- WebApp auf dem iPad (Safari: Teilen → Zum Home-Bildschirm) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Access Audios">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1f5fa8">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Access 1 <span>Workbook Audios</span></h1>
    <p>Tippe auf eine Übung, um sie anzuhören.</p>
  </header>

  <main id="sections"></main>

  <footer class="credits">
    Alle Audios © Cornelsen Verlag. Sie werden direkt von
    <a href="https://codes.cornelsen.de/codes/products/9783060325818" target="_blank" rel="noopener">codes.cornelsen.de</a>
    abgespielt.
  </footer>

  <div id="player" class="player" hidden>
    <div class="player-inner">
      <div class="player-info">
        <span id="player-where" class="player-where"></span>
        <span id="player-title" class="player-title"></span>
      </div>
      <div class="player-seek">
        <span id="time-now" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position im Audio">
        <span id="time-total" class="time">0:00</span>
      </div>
      <div class="player-buttons">
        <button id="btn-back" class="ctl" type="button" aria-label="10 Sekunden zurück">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          <span>10 s</span>
        </button>
        <button id="btn-play" class="ctl ctl-main" type="button" aria-label="Abspielen">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
        </button>
        <button id="btn-fwd" class="ctl" type="button" aria-label="10 Sekunden vor">
          <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg>
          <span>10 s</span>
        </button>
      </div>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
